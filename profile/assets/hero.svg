<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">AutoRFx — 자동차 부품 RFQ 분석 · Citation · 사전원가 Agentic RAG</title>
  <desc id="desc">수백 페이지 다국어 자동차 부품 RFQ 문서를 원본 불변 원칙으로 파싱하여 부서별 라우팅, 원문 Citation 추적, 사전원가 Go/No-Go 판단을 수행하는 Agentic RAG 플랫폼.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101c34"/>
      <stop offset="1" stop-color="#102c3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5de4dc"/>
      <stop offset="1" stop-color="#7aaaff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a5c4de" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1120" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1120" height="340" rx="20" fill="url(#grid)"/>
  <path d="M0 339H1120" stroke="url(#accent)" stroke-width="3"/>
